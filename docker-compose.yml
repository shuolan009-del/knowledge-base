# knowledge_base 基础设施统一编排
# 统一管理三个数据库：Milvus(向量库) / MongoDB(对话历史) / MinIO(对象存储)
# 其中 Milvus standalone 依赖 etcd 作为元数据存储，故一并纳入（etcd 不对外暴露端口）。
#
# 启动:  docker compose up -d
# 停止:  docker compose down          (保留数据卷)
# 停止并清数据: docker compose down -v
#
# 所有端口均绑定 127.0.0.1，仅供本机服务访问。

services:
  # ---- Milvus 元数据存储（内部依赖，不直接对外）----
  etcd:
    image: quay.io/coreos/etcd:v3.5.14
    container_name: kb-etcd
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - etcd-data:/etcd
    command: >-
      etcd -advertise-client-urls=http://etcd:2379
      -listen-client-urls http://0.0.0.0:2379
      --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3

  # ---- MinIO 对象存储（项目文档/图片）----
  minio:
    image: minio/minio:RELEASE.2025-10-15T17-29-55Z
    container_name: kb-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data
    command: ["server", "/data", "--console-address", ":9001"]
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # ---- Milvus 向量数据库 ----
  milvus:
    image: milvusdb/milvus:v3.0.0
    container_name: kb-milvus
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    volumes:
      - milvus-data:/var/lib/milvus
    ports:
      - "127.0.0.1:19530:19530"
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 120s
      timeout: 20s
      retries: 3

  # ---- MongoDB 对话历史 ----
  mongo:
    image: mongo:7
    container_name: kb-mongo
    volumes:
      - mongo-data:/data/db
    ports:
      - "127.0.0.1:27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  etcd-data:
  minio-data:
  milvus-data:
  mongo-data:
