[project]
name = "knowledge-base"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "openai-agents>=0.19.0",
    "colorlog>=6.10.1",
    "dashscope>=1.26.4",
    "fastapi>=0.138.0",
    # local-onnx 模式的本地向量推理（ONNX CPU，服务器 2C2G 可跑）
    "fastembed>=0.2.0",
    "grandalf>=0.8",
    "langchain>=1.3.10",
    "langchain-openai>=1.3.2",
    "langchain-text-splitters>=1.1.2",
    "langgraph>=1.2.6",
    # Milvus Lite：MILVUS_URL 指向本地 .db 文件时进程内嵌运行，无需 docker/etcd/minio
    "milvus-lite>=2.4.0",
    "numpy>=2.4.6",
    "pymilvus>=3.0.0",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.51.0",
]

# local-gpu 模式（本机 GPU/CPU 满血 BGE-M3 + sparse 双向量）才需要：
#   uv sync --extra gpu
# local-onnx / api 模式无需安装，依赖体积从 ~1.3GB 降到 ~400MB
[project.optional-dependencies]
gpu = [
    "flagembedding>=1.4.0",
    "pymilvus-model>=0.3.2",
]
